<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Custom Launcher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="ambientA" class="ambient"></div>
    <div id="ambientB" class="ambient"></div>

    <div id="artA" class="art-layer"></div>
    <div id="artB" class="art-layer"></div>
    <div id="scrim"></div>

    <div id="dim"></div>

    <header id="top">
      <div id="clock">
        <span id="time">--:--</span>
        <span id="ccToggle"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="36" height="13" rx="6.5"/><circle cx="34" cy="15.5" r="2.6"/><rect x="6" y="27" width="36" height="13" rx="6.5"/><circle cx="14" cy="33.5" r="2.6"/></svg></span>
      </div>
    </header>

    <div id="cc"><div id="ccGrid"></div></div>

    <div id="grid"></div>

    <div id="toast"></div>

    <div id="settings" class="hidden">
      <div class="panel">
        <h2 id="settingsTitle"></h2>
        <div id="settingsList"></div>
        <p id="settingsHint"></p>
      </div>
    </div>
  </div>

  <script src="js/luna.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
