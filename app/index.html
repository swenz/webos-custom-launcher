<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Custom Launcher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="ambientA" class="ambient"></div>
    <div id="ambientB" class="ambient"></div>

    <div id="dim"></div>

    <header id="top"><div id="clock"><span id="time">--:--</span></div></header>

    <div id="grid"></div>

    <div id="toast"></div>

    <div id="settings" class="hidden">
      <div class="panel">
        <h2 id="settingsTitle"></h2>
        <div id="settingsList"></div>
        <p id="settingsHint"></p>
      </div>
    </div>
  </div>

  <script src="js/luna.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
